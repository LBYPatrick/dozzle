on:
  push:
    branches:
      - exp
  workflow_dispatch:
name: Push exp container

# Fork-only release channel. Everything from the `exp` branch is built and
# published under this repo owner's own namespace, so it never collides with the
# upstream amir20/dozzle images that dev.yml and deploy.yml publish.
#
# Required repository secrets: DOCKER_USERNAME, DOCKER_PASSWORD (a Docker Hub
# access token). Optional repository variable: DOCKERHUB_IMAGE, if the Docker Hub
# repo is not lbypatrick/dozzle.

permissions:
  contents: read
  packages: write

concurrency:
  group: exp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildx:
    name: Build and push exp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Log in to the Container registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_IMAGE || 'lbypatrick/dozzle' }}
            ghcr.io/lbypatrick/dozzle
          tags: |
            type=raw,value=latest
            type=raw,value=exp
            type=sha,prefix=exp-,format=short
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Writing certs to file
        # The binary bakes in a shared cert used for agent mTLS. Reuse the repo
        # secrets when they exist so images from different builds still talk to
        # each other; otherwise generate a throwaway pair, in which case server
        # and agents have to come from the same build.
        env:
          TTL_KEY: ${{ secrets.TTL_KEY }}
          TTL_CERT: ${{ secrets.TTL_CERT }}
        run: |
          if [ -n "$TTL_KEY" ] && [ -n "$TTL_CERT" ]; then
            printf '%s\n' "$TTL_KEY" > shared_key.pem
            printf '%s\n' "$TTL_CERT" > shared_cert.pem
          else
            make shared_key.pem shared_cert.pem
          fi
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          build-args: TAG=exp-${{ steps.sha.outputs.short }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose Docker Hub overview
        # Same composer the local `make dockerhub-overview` uses, so CI and the
        # published page can never disagree about what the listing says.
        run: python3 scripts/dockerhub_overview.py --out overview.md
      - name: Upload Docker Hub overview
        # Kept as an artifact so the page can be pasted by hand when the
        # description sync below is skipped.
        uses: actions/upload-artifact@v7
        with:
          name: dockerhub-overview
          path: overview.md
          retention-days: 30
      - name: Check description credentials
        id: desc
        # Docker Hub's description endpoint rejects access tokens with 403 — it
        # wants an account password — while image push wants a token. So the two
        # use separate secrets, and the sync is skipped (not failed) when the
        # password is absent: the images are already published by this point and
        # a missing overview should not redden the run.
        env:
          DESC_PASSWORD: ${{ secrets.DOCKERHUB_DESCRIPTION_PASSWORD }}
        run: |
          if [ -n "$DESC_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub overview not synced from CI. Run 'make dockerhub-overview' locally, or set the DOCKERHUB_DESCRIPTION_PASSWORD secret to an account password (access tokens are refused by that API)."
          fi
      - name: Update Docker Hub description
        if: steps.desc.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_IMAGE || 'lbypatrick/dozzle' }}
          short-description: "Experimental fork of amir20/dozzle. Not official; for testing and feedback."
          readme-filepath: ./overview.md
